name = "lwm-parking-reservations"
main = "src/index.js"
compatibility_date = "2026-10-06"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "parking-reservations"
# Replace this value with the database_id returned by `npm run db:create`.
database_id = "c6a37e61-a0bc-4b4a-8fb1-430a810853f2"
migrations_dir = "migrations"

[vars]
STAFF_EMAIL_DOMAIN = "lwm-info.org"
APP_TIME_ZONE = "America/Chicago"
PARKING_EMAIL_ENABLED = "false"

# Configure these in the Cloudflare Worker dashboard, not in this file.
# ACCESS_TEAM_DOMAIN, ACCESS_AUD, ADMIN_EMAILS

# Checks 6 PM Central on Sundays across daylight saving changes.
[triggers]
crons = ["0 0,23 * * *"]
